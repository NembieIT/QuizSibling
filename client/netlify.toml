[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: mọi đường dẫn client-side đều trả về index.html (tránh 404 khi refresh/deep-link)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  VITE_API_URL = "https://quizsibling.onrender.com"